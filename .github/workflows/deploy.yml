name: Deploy Static OTA API & Landing Page to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Setup Java & Flutter to build Flutter Web App
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web App (/app/)
        run: flutter build web --release --base-href "/app/"

      # 2. Setup Node.js to build Next.js Static Landing Page
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Next.js Dependencies
        working-directory: ./landing
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: ./landing
        run: npm run build

      # 3. Merge Flutter Web build into Next.js export at ./landing/out/app
      - name: Merge Flutter Web into Static Output
        run: |
          mkdir -p ./landing/out/app
          cp -r build/web/* ./landing/out/app/

      # 4. Upload Complete Pages Artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
